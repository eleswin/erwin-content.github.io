<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#080808;
  --border:rgba(255,255,255,0.06);
  --text:#f0ece4;
  --muted:#5a5855;
  --accent:#e8c97a;
  --accent2:#c47c3a;
  --red:#ff4422;
  --font-d:'Bebas Neue',sans-serif;
  --font-b:'Outfit',sans-serif;
  --max:1000px;
}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-b);
  font-weight:300;
  line-height:1.5;
  min-height:100vh;
  overflow-x:hidden;
}

/* ── VIDEO FONDO ── */
#bg-video-wrap{
  position:fixed;inset:0;z-index:-1;
  overflow:hidden;pointer-events:none;
}
#bg-video{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;
  opacity:.18;
  filter:blur(6px);
  transform:scale(1.05);
}
#bg-video-wrap::after{
  content:'';position:absolute;inset:0;
  background:rgba(8,8,8,0.72);
}

/* ── HEADER ── */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:1.1rem 1.5rem;
  position:sticky;top:0;z-index:50;
  background:rgba(8,8,8,0.92);
  /* backdrop-filter solo en desktop — muy costoso en móvil */
  border-bottom:1px solid var(--border);
}
@media(hover:hover){
  header{backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);}
}
.logo{
  font-family:var(--font-d);font-size:1.3rem;
  letter-spacing:.12em;color:var(--accent);
  text-decoration:none;line-height:1;
}
.logo span{color:var(--muted);}
.header-dot{width:8px;height:8px;border-radius:50%;background:var(--red);animation:blink 2s ease infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.2;}}

/* ── LABELS ── */
.featured-label{
  display:flex;align-items:center;justify-content:space-between;
  padding:2.5rem 1.5rem 1.2rem;
  max-width:var(--max);margin:0 auto;
}
.featured-label span{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);}
.featured-label strong{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent2);font-weight:400;}

/* ── GRIDS ── */
.vid-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:1.5rem;
  padding:0 1.5rem 2.5rem;width:100%;max-width:var(--max);margin:0 auto;
}
@media(max-width:768px){.vid-grid{grid-template-columns:repeat(2,1fr);gap:.75rem;padding:0 .75rem 2rem;}}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.5rem;padding:0 1.5rem;}
@media(max-width:768px){.grid{grid-template-columns:repeat(2,1fr);gap:.75rem;padding:0 .75rem;}}

/* ── CARDS ── */
.vid-card,.card{
  position:relative;overflow:hidden;aspect-ratio:9/16;
  cursor:pointer;background:#111;
  border-radius:8px;border:1px solid var(--border);
  /* contain aisla repaints y evita recalculos de layout en el resto de la página */
  contain:layout style;
}

/* thumbnail placeholder mientras el video no carga */
.vid-card::before,.card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(160deg,#1a1a1a 0%,#0d0d0d 100%);
  z-index:0;
}

.card-video{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;z-index:1;opacity:.75;
  /* will-change solo cuando es necesario — se activa via JS al reproducir */
}

/* hover solo en dispositivos con puntero real (desktop) */
@media(hover:hover){
  .card-video{transition:transform .3s cubic-bezier(.16,1,.3,1),opacity .25s ease;}
  .vid-card:hover .card-video,.card:hover .card-video{transform:scale(1.04);opacity:.9;}
  .vid-card:hover .card-play,.card:hover .card-play{opacity:1;transform:translate(-50%,-50%) scale(1.06);}
}

.vid-card.playing .card-video,.card.playing .card-video{opacity:1;}

/* ── PLAY BUTTON ── */
.card-num{
  position:absolute;top:.75rem;left:.8rem;
  font-family:var(--font-d);font-size:.7rem;letter-spacing:.12em;
  color:var(--accent);opacity:.6;z-index:2;pointer-events:none;
}
.card-play{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:50px;height:50px;
  border:2px solid rgba(232,201,122,.5);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  opacity:.75;z-index:3;
  background:rgba(8,8,8,0.5);
  /* SIN backdrop-filter aquí — era el principal culpable del lag en móvil */
  pointer-events:none;
  transition:opacity .2s ease, transform .2s ease;
}
.card-play::after{
  content:'';
  border-left:16px solid var(--accent);
  border-top:10px solid transparent;
  border-bottom:10px solid transparent;
  margin-left:5px;
}
.vid-card.playing .card-play,.card.playing .card-play{
  opacity:0;transform:translate(-50%,-50%) scale(.7);
}

/* tap feedback en móvil */
@media(hover:none){
  .vid-card:active,.card:active{opacity:.85;}
}

/* ── HERO ── */
.hero{padding:2.5rem 1.5rem 2rem;position:relative;overflow:hidden;max-width:var(--max);margin:0 auto;}
.hero-bg{

.hero-eyebrow{

.hero-eyebrow::before{content:'';display:inline-block;width:24px;height:1px;background:var(--accent2);}
h1{

}
h1 em{font-style:normal;color:var(--accent);display:block;}
.hero-desc{font-size:.9rem;color:var(--muted);max-width:400px;line-height:1.8;}

/* ── SECTION ── */
.sec-wrap{max-width:var(--max);margin:0 auto 3.5rem;}
.sec-head{display:flex;align-items:center;justify-content:space-between;padding:2.5rem 1.5rem 1.2rem;}
.sec-title{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);}
.sec-count{font-size:.6rem;letter-spacing:.1em;color:var(--accent2);}

/* ── CONTACT ── */
.contact{padding:3.5rem 1.5rem;border-top:1px solid var(--border);max-width:var(--max);margin:0 auto;}
.contact h2{

.contact h2 span{color:var(--accent);}
.contact-links{display:flex;flex-direction:column;gap:.75rem;}
.clink{

  padding:1rem 1.2rem;border:1px solid var(--border);border-radius:6px;

@media(hover:hover){

@media(hover:none){

.clink.primary:active{background:var(--accent2);border-color:var(--accent2);}

.clink.primary .clink-icon svg{stroke:#080808;}

/* ── FOOTER ── */
footer{

.foot-dot{width:6px;height:6px;border-radius:50%;background:var(--red);animation:blink 2s ease infinite;}
</style>

<script>
(function(){
  'use strict';

  // ── VIDEO DE FONDO — carga diferida para no competir con los videos del portafolio
  const bgVideo = document.getElementById('bg-video');
  if (bgVideo) {
    // Espera a que la página esté idle antes de cargar el fondo
    if ('requestIdleCallback' in window) {
      requestIdleCallback(() => { bgVideo.load(); }, { timeout: 2000 });
    } else {
      setTimeout(() => { bgVideo.load(); }, 1500);
    }
  }

  // ── 1. LAZY LOAD CON INTERSECTIONOBSERVER ──────────────────────────────
  // El src solo se asigna cuando la card entra al viewport.
  // Ningún video descarga datos hasta que el usuario lo ve.
  const cards = document.querySelectorAll('.vid-card, .card');

  // Asigna src al entrar al viewport — preload="metadata" trae solo el primer frame (miniatura)
  const loadObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const video = entry.target.querySelector('.card-video');
      if (video && !video.src) {
        const src = video.getAttribute('data-src');
        if (src) {
          video.src = src;
          // Fuerza mostrar el primer frame como miniatura
          video.load();
        }
      }
      loadObserver.unobserve(entry.target);
    });
  }, { rootMargin: '300px' });

  cards.forEach(card => loadObserver.observe(card));


  // ── 2. PAUSAR VIDEOS FUERA DEL VIEWPORT ───────────────────────────────
  // Si el usuario hace scroll y la card queda fuera, el video se pausa
  // automáticamente para liberar CPU/GPU.
  const visibilityObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const video = entry.target.querySelector('.card-video');
      if (!video) return;
      if (!entry.isIntersecting && !video.paused) {
        video.pause();
        entry.target.classList.remove('playing');
      }
    });
  }, { threshold: 0.1 });

  cards.forEach(card => visibilityObserver.observe(card));


  // ── 3. REPRODUCCIÓN AL TAP/CLICK ──────────────────────────────────────
  cards.forEach(card => {
    const video = card.querySelector('.card-video');
    if (!video) return;

    card.addEventListener('click', () => {
      if (!video.src) return;

      // Pausa todos los demás videos activos
      document.querySelectorAll('.card-video').forEach(v => {
        if (v !== video && !v.paused) {
          v.pause();
          v.muted = true;
          const p = v.closest('.vid-card, .card');
          if (p) p.classList.remove('playing');
        }
      });

      if (video.paused) {
        // Activa will-change solo en el video que va a reproducirse
        video.style.willChange = 'transform';
        video.muted = false;
        video.play()
          .then(() => card.classList.add('playing'))
          .catch(() => {
            // Fallback: reproducir muteado si el navegador lo requiere
            video.muted = true;
            video.play().then(() => card.classList.add('playing'));
          });
      } else {
        video.pause();
        video.muted = true;
        video.style.willChange = 'auto'; // libera la capa GPU al pausar
        card.classList.remove('playing');
      }
    });
  });

})();
</script>
