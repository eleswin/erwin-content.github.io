<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#080808">
<meta name="description" content="Erwin Content — Editor de Video">
<title>Erwin-Content</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#080808;
  --border:rgba(255,255,255,0.06); 
  --text:#f0ece4;
  --muted:#5a5855;
  --accent:#e8c97a;
  --accent2:#c47c3a;
  --red:#ff4422;
  --font-d:'Bebas Neue',sans-serif;
  --font-b:'Outfit',sans-serif;
  --max:1000px;
}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-b);
  font-weight:300;
  line-height:1.5;
  min-height:100vh;
  overflow-x:hidden;
}

header{
  display:flex;align-items:center;justify-content:space-between;
  padding:1.1rem 1.5rem;
  position:sticky;top:0;z-index:50;
  background:rgba(8,8,8,0.9);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
}
.logo{
  font-family:var(--font-d);font-size:1.3rem;
  letter-spacing:.12em;color:var(--accent);
  text-decoration:none;line-height:1;
}
.logo span{color:var(--muted);}
.header-dot{width:8px;height:8px;border-radius:50%;background:var(--red);animation:blink 2s ease infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.2;}}

.featured-label{
  display:flex;align-items:center;justify-content:space-between;
  padding:2.5rem 1.5rem 1.2rem;
  max-width:var(--max); margin: 0 auto;
}
.featured-label span{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);}
.featured-label strong{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent2);font-weight:400;}

.vid-grid, .grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:1.5rem;
  padding: 0 1.5rem 2.5rem;width:100%;max-width:var(--max); margin: 0 auto;
}
.vid-card {
  position:relative;overflow:hidden;aspect-ratio:9/16;
  cursor:pointer;background:#020202;border-radius: 8px;border: 1px solid var(--border);
}
@media(max-width:768px){
  .vid-grid, .grid{grid-template-columns:repeat(2,1fr);gap: 1rem;padding: 0 1rem 2.5rem;}
}

.card-video {
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;opacity: 0;
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
}
.vid-card:hover .card-video {transform: scale(1.04);}
.vid-card.playing .card-video {opacity: 1;}

.card-num{position:absolute;top:.75rem;left:.8rem;font-family:var(--font-d);font-size:.7rem;letter-spacing:.12em;color:var(--accent);opacity:.6;z-index:2;pointer-events: none;}
.card-play{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:50px;height:50px;
  border:2px solid rgba(232,201,122,.5);border-radius:50%;display:flex;align-items:center;justify-content:center;
  opacity:0.75;transition:opacity 0.2s ease, transform 0.2s ease;z-index:3;background:rgba(8,8,8,0.4);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);pointer-events: none;
}
.card-play::after{content:'';border-left:16px solid var(--accent);border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:5px;}
.vid-card:hover .card-play {opacity:1;transform:translate(-50%,-50%) scale(1.06);}
.vid-card.playing .card-play {opacity: 0;transform:translate(-50%,-50%) scale(0.7);}

.hero{padding:4.5rem 1.5rem 3.5rem;position:relative;overflow:hidden;max-width:var(--max);margin:0 auto;}
.hero-bg{position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 120%,rgba(232,201,122,.06) 0%,transparent 70%);pointer-events:none;}
.hero-eyebrow{font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:1rem;display:flex;align-items:center;gap:.6rem;}
.hero-eyebrow::before{content:'';display:inline-block;width:24px;height:1px;background:var(--accent2);}
h1{font-family:var(--font-d);font-size:clamp(3.5rem,10vw,6rem);line-height:.92;letter-spacing:.02em;text-transform:uppercase;margin-bottom:1.5rem;}
h1 em{font-style:normal;color:var(--accent);display:block;}
.hero-desc{font-size:.9rem;color:var(--muted);max-width:400px;line-height:1.8;}

.sec-wrap{max-width:var(--max);margin:0 auto 3.5rem;}
.sec-head{display:flex;align-items:center;justify-content:space-between;padding:2.5rem 1.5rem 1.2rem;}
.sec-title{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);}
.sec-count{font-size:.6rem;letter-spacing:.1em;color:var(--accent2);}

.contact{padding:3.5rem 1.5rem;border-top:1px solid var(--border);max-width:var(--max);margin:0 auto;}
.contact h2{font-family:var(--font-d);font-size:clamp(2.8rem,10vw,4.5rem);letter-spacing:.03em;line-height:.95;text-transform:uppercase;margin-bottom:2.5rem;}
.contact h2 span{color:var(--accent);}
.contact-links{display:flex;flex-direction:column;gap:.75rem;}
.clink{
  display:flex;align-items:center;gap:.85rem;padding:1rem 1.2rem;border:1px solid var(--border);border-radius: 6px;
  text-decoration:none;color:var(--text);font-size:.85rem;font-family:var(--font-b);font-weight:400;
  transition:border-color .25s,background .25s, transform 0.2s;position:relative;overflow:hidden;
}
.clink::after{content:'';position:absolute;right:1.2rem;font-size:.75rem;color:var(--muted);transition:transform .25s,color .25s;}
.clink:hover,.clink:active{border-color:rgba(232,201,122,0.3);background:rgba(232,201,122,0.01);transform: translateX(2px);}
.clink.primary{background:var(--accent);border-color:var(--accent);color:#080808;font-weight:600;}
.clink.primary::after{color:#080808;opacity:.5;}
.clink.primary:hover,.clink.primary:active{background:var(--accent2);border-color:var(--accent2);}
.clink-icon{width:32px;height:32px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.clink-icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.clink.primary .clink-icon svg{stroke:#080808;}

footer{padding:1.5rem;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;max-width:var(--max);margin:0 auto;}
.foot-copy{font-size:.6rem;letter-spacing:.08em;color:var(--muted);}
.foot-avail{display:flex;align-items:center;gap:.4rem;font-size:.6rem;letter-spacing:.08em;color:var(--muted);}
.foot-dot{width:6px;height:6px;border-radius:50%;background:var(--red);animation:blink 2s ease infinite;}
</style>
</head>
