<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERWIN_CONTENT</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:#050505;
overflow-x:hidden;
color:white;
}

/* Fondo animado */

.bg{
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 20%,rgba(0,180,255,.15),transparent 30%),
radial-gradient(circle at 80% 50%,rgba(0,180,255,.10),transparent 30%),
radial-gradient(circle at 50% 80%,rgba(0,180,255,.08),transparent 30%);
animation:float 12s infinite alternate;
z-index:-1;
}

@keyframes float{
from{transform:translateY(-20px);}
to{transform:translateY(20px);}
}

/* Hero */

.hero{
height:35vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
}

.hero h1{
font-size:clamp(3rem,8vw,7rem);
font-weight:800;
letter-spacing:.15em;
text-shadow:0 0 25px rgba(0,180,255,.5);
}

.hero p{
margin-top:10px;
color:#8b8b8b;
letter-spacing:.3em;
}

/* Grid */

.grid{
width:min(1400px,95%);
margin:auto;

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));

gap:30px;

padding-bottom:120px;
}

/* Videos */

.card{
position:relative;
overflow:hidden;

border-radius:28px;

background:#111;

transform:translateY(0);

transition:.4s;
}

.card:nth-child(2n){
margin-top:60px;
}

.card:nth-child(5n){
margin-top:-40px;
}

.card:hover{
transform:translateY(-10px) scale(1.03);
box-shadow:0 0 40px rgba(0,180,255,.25);
}

.card video{
width:100%;
height:100%;
object-fit:cover;
display:block;
aspect-ratio:9/16;
}

.label{
position:absolute;
bottom:15px;
left:15px;

padding:8px 12px;

background:rgba(0,0,0,.5);

backdrop-filter:blur(10px);

border:1px solid rgba(255,255,255,.1);

border-radius:999px;

font-size:.8rem;
}

/* Footer */

.footer{

padding:100px 20px;

display:flex;
justify-content:center;
gap:50px;

font-size:1rem;

letter-spacing:.2em;
}

.footer a{
text-decoration:none;
color:white;
transition:.3s;
}

.footer a:hover{
color:#00c8ff;
}

</style>
</head>

<body>

<div class="bg"></div>

<section class="hero">

<h1>ERWIN_CONTENT</h1>

<p>VIDEO EDITOR</p>

</section>

<section class="grid">

<div class="card">
<video autoplay muted loop playsinline>
<source src="videos/reel1.mp4">
</video>
<div class="label">SHORT FORM</div>
</div>

<div class="card">
<video autoplay muted loop playsinline>
<source src="videos/reel2.mp4">
</video>
<div class="label">REAL ESTATE</div>
</div>

<div class="card">
<video autoplay muted loop playsinline>
<source src="videos/reel3.mp4">
</video>
<div class="label">SHORT FORM</div>
</div>

<div class="card">
<video autoplay muted loop playsinline>
<source src="videos/reel4.mp4">
</video>
<div class="label">AI EDITING</div>
</div>

<div class="card">
<video autoplay muted loop playsinline>
<source src="videos/reel5.mp4">
</video>
<div class="label">REAL ESTATE</div>
</div>

<div class="card">
<video autoplay muted loop playsinline>
<source src="videos/reel6.mp4">
</video>
<div class="label">SHORT FORM</div>
</div>

</section>

<footer class="footer">

<a href="#">INSTAGRAM</a>

<a href="#">WHATSAPP</a>

<a href="#">EMAIL</a>

</footer>

</body>
</html>
